name = "tokyo-license-watch-free"
main = "worker.mjs"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_REPOSITORY = "mimi0209/tokyo-license-watch-free"
ENABLE_MONITOR = "true"

# GITHUB_TOKEN must be added as a Cloudflare Secret. Never put its value in this file.
