name: Verify fast browser startup
on:
  push:
    branches: [codex/verify-fast-browser]
permissions:
  contents: read
jobs:
  verify:
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --no-shell chromium
      - run: npm run scan
        env:
          MODE: verify
