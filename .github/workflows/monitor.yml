name: Tokyo license watch
run-name: "${{ github.event_name == 'push' && 'deployment-check' || inputs.source || 'manual' }} / ${{ github.event_name == 'push' && 'verify' || inputs.mode || 'scan' }} / ${{ inputs.scheduled_at || 'now' }}"

on:
  push:
    branches: [main]
    paths: ['.github/workflows/monitor.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: "scan 检查空位；test-notification 只测试手机通知"
        type: choice
        options: [scan, test-notification]
        default: scan
      source:
        description: "由 Cloudflare 定时器或手动触发"
        type: choice
        options: [manual, cloud-timer]
        default: manual
      scheduled_at:
        description: "定时器计划触发时间（UTC，手动运行可留空）"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tokyo-license-monitor-${{ github.event_name == 'push' && 'verify' || inputs.mode || 'scan' }}
  cancel-in-progress: false

jobs:
  monitor:
    # Fail closed on a private repository so this export cannot consume paid private runner minutes.
    if: toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Record trigger
        run: |
          printf 'Source: %s\nScheduled time (UTC): %s\n' "$TRIGGER_SOURCE" "$SCHEDULED_AT"
          date -u '+Start: %Y-%m-%d %H:%M:%S UTC'
        env:
          TRIGGER_SOURCE: ${{ github.event_name == 'push' && 'deployment-check' || inputs.source }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test free timer
        if: github.event_name == 'push'
        run: node --test cloudflare/test/worker.test.mjs

      - name: Check Cloudflare deployment bundle
        if: github.event_name == 'push'
        run: |
          npm install --prefix cloudflare --no-audit --no-fund
          npm --prefix cloudflare run check
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Test timer in Cloudflare runtime
        if: github.event_name == 'push'
        run: npm --prefix cloudflare run test:runtime

      - run: npm install --no-audit --no-fund
      - name: Send requested phone test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phone-test]')
        run: npm run scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: test-notification

      - run: npx playwright install --no-shell chromium

      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watch-state-

      - name: Check availability or send test
        run: npm run scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'push' && 'verify' || inputs.mode || 'scan' }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('.state/last.json') != ''
        with:
          path: .state
          key: watch-state-${{ github.run_id }}-${{ github.run_attempt }}
